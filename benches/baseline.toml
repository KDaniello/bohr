false_verdicts_after = 0

# op-reth 1.1.5, the execution client an OP Stack chain runs, built statically from
# ethereum-optimism/op-reth and pointed at this engine. Not hunted yet — measured.
#
# It prints its version, and it starts its node. Three hundred and thirty-three thousand events and
# a hundred and thirty-three thousand syscalls in, it has read its configuration, made its data
# directory, opened its log directory and begun standing up a runtime. A survey of that whole path
# names two walls, and both are calls this build declines on purpose so the caller takes a path it
# already keeps: statx falls back to newfstatat, which is modelled, and prctl to nothing at all.
#
# What stops it is one descriptor question answered EBADF while the runtime is being built, three
# calls after the poller and its wake counter were handed out. That is a defect to be found rather
# than a capability to be added, which is what separates this row from the ones above it.
#
# HOME is recorded because without it the client will not start at all: it resolves its default data
# directory from the environment, and a guest with an empty one panics before parsing its arguments.
[m5.op_reth]
version = "1.1.5"
commit = "f54434b7bc73d1839a2eb3f5b26ccbd2c93f3d49"
built = "static, rustc 1.85, features jemalloc and optimism"
bytes = 103_292_800
version_command_runs = true
node_command_events = 333_485
node_command_syscalls = 133_457
surveyed_walls = [
  [332, "statx", "answered ENOSYS; the caller falls back to newfstatat, which is modelled"],
  [157, "prctl", "answered ENOSYS; naming a thread is not needed"],
]
needs_env = ["HOME"]

# **The node runs.** It opens its database, creates its tables, takes its lock and initialises its
# transaction pool, and then idles — polling for work no peer and no consensus client is there to
# give it. Ten runs of one seed produce one digest.
#
#   INFO Starting reth version="1.1.5 (f54434b)"
#   INFO Opening database path="/data/db"
#   INFO Transaction pool initialized
#
# Four walls came down between the runtime and here, each found by running it again. Copying a
# descriptor, which nothing could do — a socket and a counter answered EBADF, and an open file
# answered zero, which is not a refusal but standard input. Listing a directory, which answered
# empty, so the library that finds a process by reading /proc found none, including the one asking.
# What the kernel says about a process, which is generated now. And what a task has spent, which
# here is nothing.
#
# `db.growth_step` is the one thing the client is told rather than left to choose, and it is the
# honest limit rather than a convenience: its default reserves four gibibytes at a stroke, and every
# file in this world is bytes in the supervisor's memory. A sparse file model would lift it and is
# the real answer; until then the reservation is named.
runs_today = true
node_command = "node --datadir /data --chain base-sepolia --disable-discovery --http"
db_geometry = "max-size 32MB, growth-step 4MB, exclusive"
reached = "the whole of its startup, under uniform scheduling"
# The whole of it, in order:
#
#   INFO P2P networking initialized  enode=enode://2fdce0e0…@10.66.0.1:30303
#   INFO StaticFileProducer initialized
#   INFO Pruner initialized
#   INFO Creating JWT auth secret file  path="/data/jwt.hex"
#   INFO Consensus engine initialized
#   INFO Engine API handler initialized
#   INFO RPC HTTP server started  url=10.66.0.1:8545
#   INFO RPC auth server started  url=10.66.0.1:8551
#   INFO Starting consensus engine
#
# **The engine API is listening**, which is the door a consensus client drives an execution client
# through, and the next thing to build is something to knock on it.
#
# What it took past the store was one address. A server binds the wildcard because it does not want
# to know which of its addresses callers will use; a node here has exactly one, so the question does
# not arise — but refusing the wildcard turned "listen anywhere" into EINVAL and stopped the network
# builder dead. `--ipcdisable` is passed because the endpoint it wants is a Unix socket, which is
# not modelled and is named rather than worked around.
listens_on = ["10.66.0.1:8551 engine API", "10.66.0.1:8545 JSON-RPC", "10.66.0.1:30303 peers"]
extra_flags = ["--ipcdisable", "--disable-discovery"]

# **It came up under uniform scheduling only, and that is no longer true.** Under the default it
# used to stop at its transaction pool four million steps in, because a thread that yielded once
# during startup was demoted below the priced band and nothing could promote it again. A yield says
# "let somebody else go now" and is taken to mean that and no more, so the demotion is gone; the
# numbers below are the ones taken before it, under uniform choice, and `[m5.engine_api]` carries
# the pair taken after.
scheduler = "random"
events = 600_000
syscalls = 292_885
draws = 360_977
repeats_agreeing = 5
# Where an idle node spends itself, from a run capped at three million events: it asks the time and
# it waits for something to happen. Recorded because it is the shape of a node with nothing to do,
# and the next thing to do about this target is to give it something.
idle_spend = [
  [228, "clock_gettime", 1_199_348],
  [232, "epoll_wait", 532_906],
  [74, "fsync", 379],
]
walls_taken_down = [
  [2, "open", "the older spelling, without a descriptor to be relative to"],
  [72, "fcntl", "duplicating a socket, a counter and an open file"],
  [217, "getdents64", "listing a directory, which is how a process finds itself"],
  [98, "getrusage", "what a task has spent, which here is nothing"],
]
generated_proc = ["/proc/self/stat", "/proc/1/stat", "/proc/uptime"]

# **The execution client answers.** A caller on the second node authenticates the way a consensus
# client does — a bearer token signed with the secret both nodes were given in the state they start
# from — and asks the engine three questions. All three come back.
#
#   chainId 0x14a34
#   capabilities 16
#   forkchoice {"error":{"code":-38002,"message":"Invalid forkchoice state"}}
#
# **The refusal is the result, not a failure of one.** Zero is not a block this node has, so the
# only correct answer is that the state is invalid — and an answer is what was under test. The
# client's own log agrees from the other side: `Received invalid forkchoice updated message`.
#
# One wall stood between the connection and the answer, and it was on the way back rather than the
# way in. The request arrived whole and the client read it; its reply never left. A server puts its
# headers and its body on the wire in one vectored call, and `writev` on a socket was not recognised
# as a network call at all — it fell past the network to a filesystem that had never heard of the
# descriptor and came back EBADF. The client then closed the connection, so the caller's own read
# returned nought, which is how the defect first showed: as a stream that ended before it began.
#
# `horizon_ticks` is what the numbers below rest on. The exchange is over by 0.22 s of virtual time
# and the node then polls for work nobody is there to give it, so a horizon of a second is five
# times what the exchange needs and sixty times cheaper than the one this scenario was written with.
#
# `seconds_per_run` is the number every campaign against this target will be sized by, and it is
# what an idle node costs rather than what the exchange does: nine hundred thousand intercepted
# calls, almost all of them a clock read or a wait.
[m5.engine_api]
host = "x86_64, Ubuntu 24.04 under the Windows subsystem, Core i5-12600KF"
scenario = "examples/engine-driver/scenario.toml"
driver = "examples/engine-driver, one command line per node"
chain_id = "0x14a34, which is Base Sepolia"
capabilities_offered = 16
events = 1_667_147
syscalls = 933_353
draws = 3_343
repeats_agreeing = 10
seconds_per_run = 59
walls_taken_down = [
  [20, "writev on a socket, which is how a server answers"],
]

# **The default policy is the one that finishes, and the pair is what says so.** The same seed and
# the same horizon under uniform choice reach the client and its capabilities and then run out of
# time: the third call, the one that reaches the engine itself, never comes back.
#
# The draw counts are where the difference lives. Uniform choice pays the tape at every decision
# with more than one task ready — a million of them here — while PCT draws its change points once
# per window of a thousand steps and follows a priority order in between. That is the policy's whole
# design, and against a client this size it is also what makes it the faster of the two.
#
# Recorded as a correction: `[m5.op_reth]` above says this target came up under uniform scheduling
# only, which was true when a yield demoted the task that made it.
[m5.engine_api.by_policy.pct]
draws = 3_343
answered = ["chainId", "capabilities", "forkchoice"]

[m5.engine_api.by_policy.random]
draws = 1_001_368
answered = ["chainId", "capabilities"]
unfinished = "the forkchoice call had not come back when the horizon arrived"

# **The client builds a chain, and the caller builds none of it.** The driver runs the loop an OP
# consensus client runs in sequencer mode — start building, take back what was built, hand it
# straight over to be validated, name the hash the client returned as the head — and the payload
# crosses it as text. Three fields are read out of one, and each of them is a value the client
# produced.
#
# `gasLimit` is in the attributes because the client asked for it by name and not because anybody
# looked it up: the first attempt was refused with `missing field gasLimit`, which is the whole
# method here — the client is the authority on what a caller owes it.
#
# Every block has the same state root because every block is empty, which is what `noTxPool` and an
# empty transaction list mean. It is still the value a second implementation of this specification
# would have to match, and it is written to a file for a projection to read.
[m5.op_reth.chain]
scenario = "examples/engine-driver/scenario.toml"
engine_calls = "forkchoiceUpdatedV1 with attributes, getPayloadV1, newPayloadV1, forkchoiceUpdatedV1"
version_reason = "the genesis of this chain is stamped before the fork that brought withdrawals"
blocks_built = 4
head = "0xedc91d5cb74caeec19e2725a07fcf465afe5539030e238f8d14edb47c66fac10"
finalized = "0x965f1145eec710595c0bd0451bd2374a0cec5cab53d5ff95a9d2e04420a082fc"
state_root = "0x907f339ca16b3e45a89a7f4cc29d4430c8d4178d73b370ec9180e04a0dd7fcf3"
promises_verified = 4
repeats_agreeing = 5

# History rewound to the newest final block and a different one built from it. The pair the gate
# asks for is the same scenario with the fault and without: `scenario.toml` builds four blocks and
# ends on one head, `reorg.toml` builds those four, rewinds and builds two siblings, and ends on
# another.
#
# **The event count is not the measure here, and saying so is the point.** `[m4_1.reorg]` counted
# events because its guests finished and the run ended when they did. This node never exits, so a
# run ends at its horizon and the event count follows the horizon rather than the work: 1 665 333
# events at a second and 3 332 344 at two, whatever the caller did in between. What the rewind
# changed is the chain, so the chain is what is recorded.
# The first campaign against an execution client. Drawn crashes under guided targeting, and a
# caller that holds the client to what it answered: a block it called `VALID` and was then told is
# final is a block that is still at that height when it comes back.
#
# **Every crash landed on a node with something outstanding**, which is what makes the clean part of
# this readable. Two hundred and seventy crashes and two hundred and seventy markers: no run here
# died where nothing was at stake, so fifty-two promises kept are fifty-two promises that were
# actually put at risk.
#
# `behind` is counted and is not a failure. An execution client keeps recent blocks in memory and
# writes them down on a schedule of its own, so a crash costs it the unpersisted ones and the
# consensus client is expected to drive it forward again. It never happened here, which is a
# stronger result than the oracle was built to require.
#
# `forked` is the fault the oracle exists for — a different block where a final one stood — and
# there was none.
[m5.op_reth.campaign]
scenario = "examples/engine-driver/hunt.toml"
seeds = 20
blocks_built = 55
acknowledged = 52
verified = 52
forked = 0
behind = 0
unanswered = 0
crashes = 270
crashed_runs = 20
crashes_with_something_at_risk = 270
tears = 0
runs_that_left_the_client_unable_to_start = 12
findings = 4

# **The two numbers above disagree, and the gap is the campaign's own limit rather than a rounding.**
# Twelve runs left the client printing that it could not open its own database; the panel called
# four of them findings. The other eight end with the client wedged rather than exited: it prints
# its error, unwinds into a futex nothing will wake, and the run reaches its horizon with every task
# blocked. Nothing exited badly, so nothing is judged badly.
#
# Counted from the client's own output for exactly that reason. A campaign that trusted the verdict
# alone would have reported sixteen clean runs, eight of them containing the worst outcome this
# target has.
#
# The half of it that was a rule rather than a hole is fixed: a task that exits non-zero is no
# longer overwritten by one that exits zero after it, which is what a cluster's caller does every
# time. `crates/bohr-testkit/tests/cluster_exit.rs` holds that. What is left is a guest that never
# reaches an exit at all, and a horizon that calls the run complete anyway.
[m5.op_reth.campaign.unmeasured]
verdict_missed = 8
of_runs_the_client_died_in = 12
reason = "the client wedges instead of exiting, and a horizon completes the run around it"

# The same twenty seeds from a prepared state: the datadir is initialised and durable from the
# first instruction, so no crash can take it away.
#
# **It bought no depth, and that is the measurement.** Fifty-five blocks became fifty-six. The
# missing file was never what capped this campaign; it capped the *verdicts*, and twelve runs that
# said nothing now say what they found. What caps the depth is arithmetic: a kill is drawn at one
# part in 65536 of the eligible calls (`docs/API.md` §5.2 — the finest this ABI expresses), and a
# startup of this client costs about 133 000 of them. The client is therefore killed, on average,
# **before it has finished starting**, and a campaign of twenty runs spends itself on startups.
#
# So the next thing this target needs is not a longer horizon — the ratio does not improve with one
# — but drawn faults that are not offered until the node is up.
[m5.op_reth.campaign.after_workaround]
state = "examples/engine-driver/state-initialised"
blocks_built = 56
acknowledged = 52
verified = 52
forked = 0
behind = 0
runs_that_left_the_client_unable_to_start = 0
findings = 3
expected_calls_per_kill = 65_536
startup_calls = 133_457

# **The three that remain are this world's, not the client's, and were nearly reported as findings.**
# The client panics at `crates/storage/db/src/lockfile.rs:123`, which is `.expect("own process")`:
# it asks the system for its own process and does not get it. On any real machine that cannot fail.
#
# It fails here because `/proc` in this world is an ordinary file in the ordinary filesystem —
# generated on open and then snapshotted, rolled back and torn like anything else on the disk. A
# crash takes the process's own entry away with it. `/proc` is not on the disk and must not be in
# the image.
#
# Recorded as ours. A campaign that had reported this upstream would have spent the one thing a
# hunting project cannot buy back.
# **A finding against this target cannot be reduced, and that is the gate's own requirement.** The
# bundle from seed 1 records `guest crashed`, carries `task exited 1` in its timeline, and `bohr
# replay` verifies it to the digit — `ok blake3:ef0b0d08…`, the same digest a fresh run produces.
# `bohr reduce` re-executes the same tape under the same stored configuration and is answered
# `Clean`, so it refuses with BOHR-5003: nothing went wrong, so there is nothing to minimise.
#
# Same seed, same configuration, same event stream, two verdicts. Whatever the verdict is being read
# from, it is not the run — and until it is, a finding here can be neither shrunk nor handed to
# anybody, which is what M5 asks of every one of them.
#
# Ruled out on the way, so the next person does not spend the time again: `msync` does collect what
# a guest wrote through its mappings before the sync commits, so the model is not producing an image
# the guest never asked for; and `[m5.mdbx.campaign]` put 150 seeds through the same store with no
# reopen failure at all.
[m5.op_reth.campaign.after_workaround.cannot_reduce]
bundle_outcome = "guest crashed"
replay_verifies = "ok, and to the same digest a fresh run produces"
reduce_says = "BOHR-5003: replayed clean, so there is nothing to reduce"
blocks = "the gate's own words: every finding reproducible from a published bundle by a third party"
fixed_by = "a prefix that covers what the run read, taken from the run's own draw journal"

# **The reduction runs now, and it is the run cost that stops it being useful.** The baseline
# reproduces — `reducing 1222888 events · guest crashed`, where before it was refused — and the
# bundle it wrote replays. What it removed is almost nothing: three per cent of the events and a
# tenth of a per cent of the draws.
#
# The spend says why. Twenty replays bought two to verify, two for the configuration — this
# scenario schedules no faults, so there is nothing there to take away — sixteen for the tape, and
# **none at all for the events**, which is the pass that does the work. `[m4.reduction]` had a
# budget of two thousand and spent twenty of them on a scripted fixture.
#
# Two thousand replays here is forty-one hours, because a run against this client is seventy-five
# seconds. So reduction against a real target is bounded by what a run costs and not by the
# algorithm, and the throughput work that looked like a convenience is what decides whether a
# finding can be handed to anybody in the shape the milestone asks for.
[m5.op_reth.reduction]
bundle = "in findings/, which is not published"
events_before = 1_222_888
events_after = 1_189_704
draws_before = 495_591
draws_after = 495_453
replays_budget = 20
replays_spent = { verifying = 2, config = 2, events = 0, tape = 16 }
reduced_bundle_replays = true
seconds_per_replay = 75
budget_the_scripted_fixture_had = 2_000

# What ending the run with the node it was for is worth, measured on the scenario that builds a
# chain and nothing else. The caller finishes at 0.22 s of virtual time and the horizon was a
# second, so nine tenths of every run was a client polling for work nobody was there to give it.
#
# The hunt is untouched by this and that is right: there the caller does not finish, because the
# client it is asking has died, so the horizon is still what ends the run. The saving is on the runs
# that go well, which is most of them.
# **The search can see, and this is the number that says so.** `[m3.reach.unmeasured]` above records
# coverage as zero and reads as though the machinery had never worked. It had: what it says is that
# `raft_toy` was not built against the runtime. An example that is — `redb-hunt`, carrying its own
# `rustflags.txt` and linking `sdk/c/bohr-cov-rt.c` from its `build.rs` — fills the map.
#
# The corpus growing with the budget is the part that matters. A map that filled and stopped would
# mean the guest walks one path whatever it draws, and a corpus that stayed empty would mean nothing
# was ever novel; neither happened. What it steers is real: two operators earned entries, and the
# campaign at ninety-six runs reached a crash that the shorter ones did not.
#
# Against third-party code rather than a fixture: `redb` is somebody else's database and the eleven
# megabytes here are mostly it.
[m3.coverage]
guest = "examples/redb-hunt, redb 2.6.3, instrumented with sanitizer-coverage-level=3"
runtime = "sdk/c/bohr-cov-rt.c, linked by the example's own build.rs"
runs = [24, 48, 96]
edges = [4_052, 4_062, 4_155]
corpus = [18, 29, 42]
generations = [1, 2, 3]
runs_per_second = 2.77
credit = { extend = 19, interesting = 1 }

# What the longest of them reached, and it is recorded as evidence that the feedback steers rather
# than as a finding about anybody: `redb-hunt` is our own example, so a panic in it may be ours.
# Two kills, a restart, and the guest exits 101 — a Rust panic. It reproduces from its bundle and
# not from its seed, because the tape that reached it was mutated rather than derived.
# The same instrumentation against a real execution client, and the number that matters is not the
# first one.
#
# op-reth builds with it: `-Cpasses=sancov-module` at level 3 and the same runtime object linked
# through `-Clink-arg`, on the toolchain the client itself pins. Two things had to give way and both
# are worth writing down, because the next person meets them in the same order. The current
# toolchain will not build this client at all — a lifetime rule changed under `metrics-0.24.1` — so
# it is built with the one the client was released against. And link-time optimisation and this pass
# do not compose: instrumented units fail to resolve generics out of an uninstrumented std, so the
# build turns it off.
#
# **What it measured is a ceiling rather than a success.** Thirty-two thousand edges of a map that
# holds sixty-five thousand, from one startup and four blocks. Twelve further runs added
# eighty-four. Every run entered the corpus, which is what a map this full does to the feedback:
# when almost anything is novel, novelty stops choosing, and a corpus that keeps everything is a
# corpus that steers nothing.
#
# So the map is the next thing this target needs, not more campaigning. Recorded here rather than
# discovered later, and it is a fact about a 64 KiB map against a program of this size rather than
# about the client.
[m3.coverage.op_reth]
version = "op-reth 1.1.5, instrumented at sanitizer-coverage-level=3"
built_with = "the toolchain the client pins; the current one cannot build it at all"
lto = "off, because the pass and link-time optimisation do not compose"
bytes = 184_823_504
runs = [6, 18]
edges = [32_145, 32_229]
corpus = [6, 18]
map_cells = 65_536
reads = "a map half full from one path, so nearly every run is novel and the corpus keeps them all"

[m3.coverage.reached]
outcome = "GuestCrashed(exit status 101)"
bundle = "in findings/, which is not published"
attribution = "not established; the guest is ours and the panic may be too"

[m5.op_reth.ends_with_node]
scenario = "examples/engine-driver/scenario.toml"
events_before = 1_665_335
events_after = 375_557
seconds_before = 59
seconds_after = 12
blocks_built = 4
promises_verified = 4

# What the client says after a crash once the datadir is initialised, and it is **not yet
# attributed**. MDBX refuses to open a store it wrote itself: `failed to open the database: invalid
# parameter specified (22)`.
#
# It is either the store failing to recover from a legal crash state or this world producing a state
# no disk can leave, and today's work says be careful: two failures that looked like the client's
# turned out to be this world's. One thing about the setup weighs against reporting it as it stands
# — every file here is bytes in supervisor memory, so the client is run with `--db.growth-step 4MB`
# against reth's own default of four gibibytes. That is a geometry nobody operates.
[m5.op_reth.campaign.after_workaround.unattributed]
client_said = "failed to open the database: invalid parameter specified (22)"
suspect = "the geometry this world forces, which no operator runs"
ruled_out = ["msync collects mapped writes before it commits", "150 seeds of mdbx-hunt reopen cleanly"]

[m5.op_reth.campaign.after_workaround.ours_not_theirs]
seeds = [1, 13, 16]
client_said = "panicked at crates/storage/db/src/lockfile.rs:123, expect(\"own process\")"
cause = "generated /proc files live on the modelled disk and a crash rolls them back"
