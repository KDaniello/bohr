# The walls: what stops each v1.0 target, one `bohr survey` each, written by scripts/walls.sh and
# by nothing else. A section is one run at one seed and a lower bound twice over (docs/API.md §7);
# `stopped_by` is the first thing a target cannot get past, and the work v0.3 and v0.5 start from.
[walls.redb]
binary = "redb-hunt"
sha256 = "78ee6b2b0fa79dc5f48931291917f955c32308d14b6d51036b50151d4e0e6c12"
linkage = "static"
survey = "--max-events 1000000 --config examples/redb-hunt/scenario.toml"
args = ""
seed = 1
events = 3714
ran = "to completion"
walls = 1

[walls.redb.calls]
statx = { nr = 332, calls = 2, wall = "answered ENOSYS" }

