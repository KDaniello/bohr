#
# `prepared_seen` is the denominator of the last claim and is why the claim can be read at all: a
# run that found no prepared record reports none lost, which is the line a run that found them all
# and kept them prints. Thirty-two sampled per run, and every one of them there at the end.
[m5.mdbx.campaign_prepared]
seeds = 100
scenario = "examples/mdbx-hunt/hunt-prepared.toml"
acknowledged = 6_323
verified = 6_323
lost = 0
resurrected = 0
undropped = 0
prepared_seen_per_run = 32
prepared_lost = 0
crashes = 102
crashed_runs = 65
tears = 21
watcher_verdicts = 0

# What the sharpening cost, measured on the seeded defect the watcher exists for rather than argued
# about. `kv_ack_quiet` is a store that answers before it syncs; the same twenty seeds catch it the
# same number of times with the condition and without. Forty-one false verdicts gone, no true one.
[m5.durability_watcher]
condition = "the node wrote something since it last asked a socket for work"
seeded_defect = "kv_ack_quiet"
