# **What the first day of hunting a real target actually cost, and what closes most of it.** Four
# things looked like an execution client's defects; three were this tool's, and each was disproved
# only by reading the client's source. That does not scale, and it is the opposite of what an
# external simulator is for: the tool that created the condition should be the one that says the
# condition was impossible.
#
# Two rules, checked as a run goes and stated independently of the code that would have to be wrong
# for them to trip. At every crash the image must be one a machine could leave; at every answer a
# descriptor this world issued is never answered `EBADF`. A run that breaks either stops under
# `BOHR-5005` naming the file or the descriptor, rather than being reported as a finding.
#
# Each rule is measured against the defect it exists for, reintroduced by an injection that names
# it, in the harness that already holds every other determinism claim to the same standard.
[m4.own_evidence]
false_accusations_seen = 3
closed_by_a_rule = 2
still_open = "a listener that served one connection: the port table lost an accepted socket, and the answer was a refused connection rather than a state no machine could present"
injections = ["chaos-unknown-descriptor", "chaos-proc-on-the-disk"]
caught = 2

# What the rules cost a campaign that has nothing wrong with it, which is the number that decides
# whether they can be left on. Ten seeds of the store hunt and three of the engine-API hunt against
# the real client: no refusals, the same chain built and finalised, the same digests a run without
# the rules would have produced — a file no write touched is the same counted pointer the durable
# image holds, so proving it unchanged is one comparison.
[m4.own_evidence.against_a_clean_run]
redb_hunt_seeds = 10
op_reth_hunt_seeds = 3
refusals = 0

# **The number the search was missing, and it was never a number about the campaign.** A coverage
# map holds one counter per edge, and a map with fewer counters than the guest has edges puts two
# edges on one: two runs that differ only there are one run to the corpus, and a search whose
# feedback has stopped discriminating looks exactly like one that has covered everything.
#
# The guest is the only side that knows how many edges it has, so it now says: the shared region
# carries a header, the supervisor writes how many counters are in it, and the runtime writes what
# the compiler's guard ranges added up to. Against the instrumented client that number is two and a
# quarter million, against a default map of sixty-five thousand — smaller by a factor of thirty-four.
#
# `covered` below is one run of one seed at three map sizes. It is the same run each time; what
# changes is how much of it the map could hold apart. At the default size a quarter of what the run
# reached was invisible, folded onto counters that already stood for something else.
[m3.coverage.op_reth.sized]
guest_edges = 2_201_469
covered_at_65536 = 31_124
covered_at_1048576 = 41_215
covered_at_4194304 = 41_774
lost_to_aliasing_at_the_default = "25% of what the run reached"
raised_by = "[coverage] shm_size, 1 KiB to 64 MiB, default unchanged at 65 536"

# **A defect this measurement found in the tool, and it is not about coverage.** Under two map sizes
# the client produces the same 36 735 events, in the same order, with the same returns — and two
# different digests. Every differing line is an argument register of a call that does not take one:
# `sched_yield` takes none of six, `clock_gettime` takes two. In a program this size the leftovers
# are pointers, and a different memory footprint moves them.
#
# So the digest is stricter than "the same run": it fires on register values nothing reads. What it
# costs is every future comparison between two runs that differ in something harmless. The remedy is
# to record the arguments a call has rather than the registers it was entered with, which is a
# change to what every stored digest is, and is not made here.
[m3.coverage.op_reth.sized.digest_sensitivity]
events = 36_735
events_differing = 0
returns_differing = 0
lines_differing = 11_233
all_of_them = "argument registers of calls that do not take them"
calls = { clock_gettime = 10_792, sched_yield = 411, shutdown = 24, listen = 3, epoll_create1 = 1, eventfd2 = 1, getpid = 1 }
remedy = "record the arguments a call has, not the registers it was entered with"

# **A wall that was not there any more, and nobody had looked.** `PLATFORMS.md` §4.1 said killing a
# node with more than one task stalls the run, and named the scenario that reproduced it on demand.
# It does not: ten seeds, five tasks, a kill and a restart written into the scenario, every run
# completing and answering its durability questions.
#
# Nothing was fixed on purpose. Whatever closed it was done for another reason, and the row outlived
# the defect — which is the argument for re-measuring a stated limit rather than reading it. It cost
# one command and it moved a milestone's scope: this was the largest item on the list of what stood
# between here and hunting a real client, because every real client is thread-heavy and the kill is
# the fault the campaigns are built on.
#
# What it is not: one scenario re-measured, so the honest claim is that this shape is gone rather
# than that every shape is.
[m4_2.multi_task_kill]
scenario = "examples/mdbx-hunt/scenario.toml, with both of its [[fault]] tables"
seeds = 10
stalled = 0
tasks_per_run = 5
faults = ["node_kill", "node_restart"]
was = "PLATFORMS.md 4.1: the run stalls, and a guest under search is written with one thread per node"

# **The campaign against an execution client was firing nothing, and had been for as long as it had
# had an ending.** `examples/engine-driver/hunt.toml` armed a drawn kill three hundred milliseconds
# in. The run ends with its caller — `run.ends_with_node = 1` — at forty-four milliseconds of
# virtual time, and the three-second horizon never bounds it. So the arm was seven times past the
# end of every run: twenty seeds, no `FaultFired`, no `NodeState`, four blocks built each time, and
# twenty clean runs reported by a campaign that had not once pressed on the client.
#
# The existing refusal compares `arm_after_ticks` against `horizon_ticks` and passes, correctly: the
# horizon is three seconds. Nothing checkable at load could have known, because when a run ends is
# what the runs decide. So the runs say it instead — `BOHR-5006` for a campaign that landed nothing,
# and a line on every single run that names what reached it.
#
# The moments were set for a startup costing a hundred and thirty thousand calls; a prepared store
# made the whole run thirty-six thousand. Measured on the scenario as it stands: the client's store
# is made at 3.2 ms and the caller's blocks are not final until 42, which is the window a crash has
# to land in to be about the chain at all.
[m4_2.campaign_fired_nothing]
scenario = "examples/engine-driver/hunt.toml"
seeds = 20
was = { arm_after_ticks = 300_000_000, restart_after_ticks = 50_000_000, faults_fired = 0, findings = 0 }
now = { arm_after_ticks = 5_000_000, restart_after_ticks = 5_000_000, faults_fired = 11, findings = 7 }
runs_that_met_anything = "9 of 20, from 0 of 20"
blocks_built = 52
client_died = 7
verdict_agreed_with_the_client = "7 of 7, which is what the exit-status path was already for"
run_ends_at = "t43982000, and the horizon is 3_000_000_000"

# **Pressing every run makes the campaign worse, and this is the measurement that says so.** One
# part in 8192 with a ceiling of two: twenty runs of twenty met a kill, and nineteen of them lost
# the client before it had built a block. Four blocks across the whole campaign, against fifty-two
# at the longer odds — the chain question went unasked in nineteen runs out of twenty.
#
# Not a tuning preference: the window between the store existing and the blocks being final is
# thirty-nine milliseconds of a forty-four millisecond run, and a fault that reaches every run
# reaches it there.
[m4_2.campaign_fired_nothing.pressing_harder]
kill_probability = "1/8192"
budget_per_run = 2
runs_that_met_anything = 20
blocks_built = 4
findings = 19

# The quiet watch armed against the same campaign, and what it did not do: nothing. Recorded
# because the reason is the interesting part — `ends_with_node` ends the run when the caller gives
# up, which it does before any wedge lasts the span. The eight runs `[m5.op_reth.campaign.unmeasured]`
# recorded as judged clean while the client was dead do not reproduce on the repaired scenario: all
# seven deaths here exit non-zero and all seven are judged findings.
#
# **What arming it did cost was two false accusations, both found by arming it.** A node this world
# killed makes no calls, and so does a node whose program ended — the first fires on every run of a
# crash campaign, the second on every scenario with a caller that finishes. Both are held by tests.
[m4_2.quiet_watch]
scenario = "examples/engine-driver/hunt.toml"
quiet_ticks = 500_000_000
seeds = 20
nodes_reported = 0
why = "the run ends with the caller, before a wedged client has been silent for the span"
false_accusations_closed = ["a node the world killed or froze", "a node whose program ended"]

# **The digest now means "the same run", and this is the pair that proves it.** One execution
# client, one seed, two coverage map sizes. The runs are identical: 43 608 events, the same order,
# the same returns, the same 19 922 syscalls and 1 604 draws, and the trace text agrees line for
# line. Under the old rule — six argument registers hashed whatever the call takes — they compare as
# two different runs. Under the new one they compare as one.
#
# `[m3.coverage.op_reth.sized.digest_sensitivity]` above named this and did not fix it; the count it
# recorded, 11 233 differing lines, was on a scenario whose event count was 36 735. What is measured
# here is the property rather than that count: the difference is in registers the trace does not
# even print, which is why the line-by-line comparison shows nothing while the digest showed
# everything.
#
# BREAKING: every stored digest is invalidated. The three golden bundles and the minimal-world
# vectors were re-blessed with this commit.
[m4_2.digest_reads_what_a_call_takes]
scenario = "examples/engine-driver/scenario.toml, op-reth 1.1.5"
seed = 1
events = 43_608
syscalls = 19_922
draws = 1_604
trace_lines_differing = 0
under_the_old_rule = { at_65536 = "blake3:4c6738cf", at_4194304 = "blake3:be86a017", verdict = "two runs" }
under_the_new_rule = { at_65536 = "blake3:b6614802", at_4194304 = "blake3:b6614802", verdict = "one run" }
rule = "an address is hashed as whether it is null; a scalar by value; a register the call does not read, not at all"

