# Slowdown versus native, as measured by scripts/bench-slowdown.sh.
#
# `slowdown` is what the guest cost when the number was last taken, and `ceiling` is what the job
# refuses to go past. The gap between them is deliberate: the ratio moves with the machine, and a
# threshold tight enough to catch machine noise catches nothing else.
#
# `per_call_us` is the number to watch. A ratio divides by a native time that is mostly process
# startup and swings by a quarter between runs on one machine; the cost of a single intercepted
# syscall does not, and it is what changes when the interception path changes. One intercepted
# syscall is three context switches and about ten supervisor syscalls, plus one recorded event.
#
# The two full-stop guests are startup-dominated and their ratios say little. `cat` compares
# against a native run that reads the host's own `/dev/urandom`, which is a different amount of
# work from drawing the same bytes off a tape, so its ratio is a smoke test rather than a measure.

[measured]
host = "x86_64, ubuntu:24.04 container on Linux 6.18, Core i5-12600KF, guest pinned to one core"
build = "release"

# What starting a guest under the supervisor costs over starting it natively, in milliseconds:
# `testdata/guests/startup` traced minus native, best of twenty. A guest that lives under ten
# milliseconds is judged by this rather than by its ratio, which for such a guest is a ratio of two
# startups. The bound was written down before the first run that judged it.
[startup]
ceiling_ms = 5.0

[guests.syscall_storm]
args = ""
slowdown = 500.0
ceiling = 1000.0
per_call_us = 57.0
per_call_us_ceiling = 120.0

# The milestone workload: an embedded database on its own test suite, 37 tests over 20 000
# intercepted calls. Unlike the guests below it spends its time working rather than starting up, so
# its ratio is the one the goal is stated against.
# The one row here nothing in the tree produces. It was measured out of band, against an embedded
# database on its own test suite, and it is the row the ≤5× claim rests on — so it is marked rather
# than left to look like the others.
[guests.redb]
measured_out_of_band = true
slowdown = 3.6
ceiling = 5.0

[guests.cat]
args = "/dev/urandom"
slowdown = 1.6
ceiling = 4.0

[guests.clock_and_random]
args = ""
slowdown = 1.5
ceiling = 4.0

# How often each scheduling policy reaches the seeded defects, out of 60 seeds, as measured by
# scripts/policy-comparison.sh. PCT is the default because of the guarantee it carries, and this is
# where that either shows or does not.
#
# `race_counter` is depth 1 and reachable from almost any ordering, so it separates nothing.
# `race_init` needs two orderings to fall together, and there the difference appears. A corpus with
# depth-3 defects needs a virtual network and disk, so the comparison gets sharper at M2.

[policies.race_counter]
pct = 60
random = 60

[policies.race_init]
pct = 60
random = 47

# The cluster gate, measured on the same host as the numbers above. A five-node `raft-rs` cluster
# driven through a one-directional partition and back, one seed, a hundred repetitions, one digest.
#
# `events`, `syscalls` and `draws` are recorded because they are what changes when the model gains
# a behaviour: a gate that only says "identical" cannot tell a richer run from a shorter one.
[cluster.split_brain]
nodes = 5
repeats = 100
events = 16016
syscalls = 6448
draws = 7129

# The same scenario with its partition removed. The gap is the evidence the cut actually fired:
# a run that lost the schedule silently would sit at the lower numbers and still be identical.
[cluster.split_brain_healthy]
events = 15448
syscalls = 6244
draws = 6425

# What the cluster milestone was measured to do, on the host named above and on a Windows
# workstation with its Linux subsystem. Recorded rather than remembered: the next milestone's
# claim is "no worse than this", and a claim with no number behind it cannot be checked.
#
# `cross_machine` is the one that needs two machines to mean anything: bundles written by a
# Windows build, replayed by a Linux one, digest for digest.
[m2.gates]
cluster_repeats_identical = 100
cross_machine_bundles = 9
cross_machine_replayed = 9
sdk_conformance_checks = 16
mutation_injections = 9
mutation_injections_caught = 9
bdd_scenarios = 10
fuzz_targets = 5

# What each fuzz target reached in five minutes on the host above, in executions. The numbers vary
# wildly by target because a bundle parse is thousands of times more work than a tape draw; what
# matters is that none of them found a way to bring a reader down.
[m2.fuzz_executions]
bundle = 7_611_375
tape = 108_893_335
sdk_record = 1_333_835
event_log = 6_054_026
syscall_args = 1_003_615

# Guided against uniform fault targeting, on `kv_fsync`: a depth-2 defect where a crash must land
# between an acknowledgement and the `fsync` that would have made it durable. Sixty seeds each,
# counting how many expose the defect.
#
# The specification claimed guided finds an order of magnitude more. It does not: it loses at every
# probability, because its candidate moments are a subset of uniform's and on this target they are
# most of the run. Recorded as measured, and `docs/API.md` §5.4 withdraws the claim rather than
# softening it. The mechanism stays; the heuristic behind it is what needs the work.
[m3.targeting.uniform]
"1/400" = 13
"1/100" = 33
"1/40" = 52
"1/10" = 60

[m3.targeting.guided]
"1/400" = 6
"1/100" = 21
"1/40" = 33
"1/10" = 56

[m3.targeting]
seeds = 60
target = "kv_fsync"

# Does the search reach the seeded consensus defect? `raft_toy` is depth 3: the leader acknowledges
# a write on its own append, dies before the entry replicates, and the term that follows elects a
# node without it. Eight master seeds, the corpus-wide fault probability, `bohr explore`.
#
# `without_faults` is the measurement that keeps the rest meaningful. A defect an ordinary
# interleaving could reach would make this a gate on the scheduler rather than on the search.
[m3.reach]
target = "raft_toy"
depth = 3
master_seeds = 8
without_faults_reached = 0
without_faults_runs = 256

# What this measurement does not cover, stated because the number would otherwise be read as
# covering it. `raft_toy` is not built against the coverage runtime, so every campaign here ran
# with an empty coverage map: the corpus stayed at zero entries, nothing was ever novel, and what
# reached the defect was the fault schedule and tape mutation with no coverage feedback at all.
# The gate is met by less machinery than the milestone built, which is worth knowing in both
# directions — the search is stronger than this measurement shows, and the coverage half of it is
# still unmeasured against a real target.
[m3.reach.unmeasured]
coverage_edges = 0
corpus_entries = 0
reason = "the guest is not built with the coverage runtime"

# At a 32-run budget, reproduced twice with the same four seeds. Not a majority, so the gate is not
# met at this budget — and 32 runs is a twentieth of the budget the corpus records for this defect.
[m3.reach.budget_32]
reached = 4
of = 8

# At the recorded budget, every master seed reaches it. Seconds and findings are per campaign, in
# master-seed order; the eighth took twice as long as the rest for a reason that is about the host
# rather than the search and is recorded under [m3.kernel_ceiling] below.
#
# An earlier attempt at this number recorded 3 of 8 and blamed the machine for running out of
# memory. That was wrong twice over: the failure was not memory exhaustion by the tool, and four
# campaigns that never started were counted as not reaching. Both are corrected here.
[m3.reach.budget_256]
reached = 8
of = 8
seconds = [161, 164, 170, 132, 164, 161, 165, 322]
findings = [5, 3, 3, 4, 5, 5, 6, 1]

# What a campaign used to cost the kernel, and what removing one namespace did to it. Kept because
# the ceiling was real and reached — consecutive campaigns slowed down and then could not place a
# guest at all — and because a number that vanished is worth as much as one that appeared.
#
# Each guest had its own network namespace, held to be what stopped an untrapped network call from
# reaching the real network. It was not: the filter traces by default and admits only calls that
# shape the guest's own address space, signals or exec, so a network call cannot reach the host
# whether or not there is an interface to try. The namespace guarded nothing and cost almost
# everything — 180 KB of unreclaimable kernel slab per guest against 4 KB for the other five
# together, freed on a lagging schedule, at 768 guests a campaign.
#
# `after_campaigns` is the unreclaimable slab after each of four consecutive campaigns on a host
# that started at 59 MB, and `still_held_after_12_min_mb` is what it had returned by then.
[m3.kernel_ceiling]
host = "x86_64, Ubuntu 24.04 under the Windows subsystem, 8 GB cap, Core i5-12600KF"
guests_per_campaign = 768
network_namespace_kb = 180
other_five_namespaces_kb = 4
after_campaigns = [1201, 2346, 3296, 2707]
still_held_after_12_min_mb = 1847
per_campaign_mb_after_removal = 0

# Reduction. A scripted two-node exchange that promises every ping is answered, run until a
# scheduled kill stops the answers: forty-nine thousand events, of which the reduction leaves
# eighteen. Measured against the null backend, so the numbers are facts about the reduction rather
# than about the host — the same run on any machine produces them.
#
# What made the difference is which of the three scheduled things mattered and when it happened.
# The grey window was removed outright; the partition and the kill were brought from tick nine
# billion to tick one, which is what turns four thousand six hundred answered rounds into one
# unanswered one. The budget was never the constraint: twenty replays of two thousand.
[m4.reduction]
target = "ping_pong"
events_before = 49477
events_after = 18
draws_before = 58468
draws_after = 17
replays_spent = 20
replays_budget = 2000
reproduced_out_of = 100

# What two real open-source programs asked for, measured with `bohr survey` rather than assumed.
# The milestone's scope list named `io_uring` as the thing its targets demand. Neither of these
# asks for one, and the wall they hit is somewhere else entirely.
#
# `redb` is an embedded database and runs to completion today: it needs nothing this build does not
# have. `tokio` is the asynchronous runtime every real network client is built on — including the
# ones this milestone exists for — and it dies at `epoll_create1`, the reactor's first call, long
# before anything could reach a ring.
#
# Both numbers are lower bounds, which is what a survey can be and no more: a call answered ENOSYS
# sends the guest down a path it would not have taken, and tokio's is to give up, so the twelve
# events below are where it stopped rather than what it needs. What the measurement settles is the
# ordering — `epoll` is the prerequisite, and `io_uring` is not what stands in the way.
[m4_1.surveyed.redb]
version = "2.6.3"
static_linked = true
runs_today = true
events = 58
syscalls = 57
draws = 7
unmodelled = []

# Superseded by `[m5.tokio]` below: the call that stopped it is modelled now.
[m4_1.surveyed.tokio]
version = "1.53.1"
static_linked = true
runs_today = false
events_before_giving_up = 12
unmodelled = [[291, "epoll_create1", 1]]

# The boundary oracles, measured as a pair. "Caught on a seeded defect" is half a claim on its own,
# because an oracle that fired on every run would satisfy it — so the number that means something
# is the twin: the same scenario, the same seeds, and a correct program it must stay silent about.
#
# `kv_ack_quiet` is `kv_fsync` with the self-check removed. Its neighbour exits 1 when it notices
# it lost an acknowledged write, so the crash oracle finds it and finding it proves nothing; this
# one serves what it has and exits 0, which is what a real client does. Nothing in the scenario
# knows what the store promises: `[durability]` says only that a node which answered somebody with
# unsynced writes behind it, and came back without them, is a finding.
#
# Measured under the real interceptor, one run per seed, scheduled kill and restart.
[m4_1.durability]
defect = "kv_ack_quiet"
twin = "kv_ack_quiet_correct"
seeds = 60
found_on_defect = 60
found_on_twin = 0
lost_bytes_at_seed_1 = 64

# Reorg. A two-node cluster appending to a log and syncing each record, with history rewound two
# entries at ten milliseconds. Measured against the null backend, so the numbers are facts about
# the fault rather than about the host.
#
# The pair is what the gate asks for — the same scenario with the fault and without it — and it is
# produced by a test rather than by somebody running the tool twice and writing down what they saw.
# The rewind costs *more* events, not fewer: both nodes die and come back, and everything they did
# after the fork point they do again.
[m4_1.reorg]
target = "two-node log"
back = 2
events_without = 491
events_with = 657
draws_without = 488
draws_with = 648

# What a real client costs, measured rather than estimated. `redb` 2.6.3 — an embedded database
# nobody wrote for this tool — doing forty write batches with a commit and a read-back each, which
# is enough work that what the ratio measures is the work rather than `execve`.
#
# The number to compare against is the per-call figure above and not this ratio: 347 intercepted
# calls against four milliseconds of native work is a heavier interception share than a database
# test suite has, which is why `[guests.redb]` sits at 3.6× and this sits at 6.6×. Both are true
# about different workloads, and neither is the other's contradiction.
#
# `campaign_runs_per_hour` is what the prepared-state gate asks for, derived from the measured run
# cost at one worker; a campaign at `-j N` multiplies it.
[m4_1.slowdown]
target = "redb 2.6.3"
host = "x86_64, Ubuntu 24.04 under the Windows subsystem, Core i5-12600KF"
events = 348
syscalls = 347
native_seconds = 0.00417
traced_seconds = 0.02747
slowdown = 6.6
campaign_runs_per_hour = 131_000

# The first hunt. `redb` 2.6.3 behind a datagram service, with a client that holds it to what it
# answered: a write the store acknowledged is a write the store still has. Nothing about `redb` is
# instrumented — the client is ours, the store is not, and the scenario knows only that a node dies
# at a drawn moment and comes back.
#
# **`verified` is the number that makes `findings` mean anything.** A campaign that reports clean
# runs without saying how many acknowledgements it asked back is a campaign that cannot tell a
# store which kept its promises from one that was never asked. The same goes for `crashes`: a run
# whose crash never fired asked a weaker question, and `crashed_runs` says how many did.
#
# `acknowledged` exceeds `verified` where the store was dead or unreachable when asked. Those are
# indeterminate and are never used to accuse, which is the distinction Jepsen draws between an
# operation that failed and one whose outcome is unknown.
#
# `refused` counts commits the store reported as failed and the client then asked about anyway: a
# refusal that is present afterwards is a store that said no and did yes. `undropped` is the same
# question for a removal, and `prepared_lost` is the one only a prepared database can ask: a record
# durable before the run began, which nothing the run did was about.
#
# The client holds the store to what it observed and to nothing else. A record it was never
# acknowledged is never asked for, a question the store was dead for is indeterminate rather than a
# loss, and prepared records are sampled at the start so a scenario that prepared none demands none.

[m5.redb.crash]
target = "redb 2.6.3"
scenario = "examples/redb-hunt/hunt.toml"
world_model = "distributed@2"
runs = 200
findings = 0
acknowledged = 12_594
verified = 12_594
refused = 0
resurrected = 0
undropped = 0
prepared_lost = 0
crashes = 330
crashed_runs = 158
torn_writes = 71

[m5.redb.hostile_disk]
target = "redb 2.6.3"
scenario = "examples/redb-hunt/hunt-disk.toml"
world_model = "distributed@2"
runs = 200
findings = 0
acknowledged = 9_503
verified = 9_135
refused = 2_925
resurrected = 0
undropped = 0
prepared_lost = 0
crashes = 287
crashed_runs = 148
torn_writes = 68

# The same hunt from a database of two thousand records rather than an empty one. It crashes more
# often and tears more often for the same fault odds, because there is more on the disk to be
# dirty at any moment — which is the reason to start from one.
[m5.redb.prepared]
target = "redb 2.6.3"
scenario = "examples/redb-hunt/hunt-prepared.toml"
world_model = "distributed@2"
prepared_records = 2_000
runs = 200
findings = 0
acknowledged = 12_534
verified = 12_534
refused = 0
resurrected = 0
undropped = 0
prepared_lost = 0
crashes = 403
crashed_runs = 171
torn_writes = 90

# The runtime every real network client in Rust is built on, and the one thing measured to stop
# this engine dead. It runs now: a current-thread runtime, a timer, a bound socket, a datagram sent
# to itself and received back.
#
# What it needed was not one call but five and a half — the readiness family, an event counter to
# wake the poller with, and the descriptor questions asked of anything just opened. Each was found
# by running the probe again rather than by reading a list: `epoll_create1` first, then `fcntl` on
# a descriptor the file model had never heard of, then `F_DUPFD_CLOEXEC`, which is `mio` giving the
# thread that wakes the poller a handle of its own.
[m5.tokio]
version = "1.53.1"
runs_today = true
events = 3_645
syscalls = 2_032
draws = 11
repeats_agreeing = 100
modelled_for_it = [
  [291, "epoll_create1"],
  [233, "epoll_ctl"],
  [232, "epoll_wait"],
  [281, "epoll_pwait"],
  [290, "eventfd2"],
  [72, "fcntl on a descriptor this model owns, including F_DUPFD_CLOEXEC"],
]

# Streams, and what they open. Everything an OP Stack node is made of talks over one — the engine
# API between the consensus client and the execution client, the JSON-RPC a user calls, the
# peer-to-peer transport, the batcher's calls to the settlement layer — and a model answering
# datagrams and nothing else reached none of them.
#
# The probe is both ends of one conversation in one process, which is what an engine API is in
# miniature: bind, listen, connect, accept, a request across and an answer back. Found the same way
# the readiness family was, by running it again after each step rather than by reading a list —
# `listen` first, and then `sendto` with a null address, which is what `send` on a connected stream
# compiles to and what a model that always read the address died on.
[m5.tcp]
runtime = "tokio 1.53.1"
runs_today = true
events = 62
syscalls = 51
draws = 7
repeats_agreeing = 100
modelled_for_it = [
  [50, "listen"],
  [43, "accept"],
  [288, "accept4"],
  [52, "getpeername"],
  [42, "connect, which was answered yes and remembered nowhere"],
  [44, "sendto with no address, which is send on a connected stream"],
]

# The store an OP Stack execution client keeps its chain in, through the binding that client uses.
# Measured, not run: it stops before it has opened anything.
#
# What stopped it is not the mapping everyone expects. `newfstatat` has a row in the table and is
# deliberately answered "not implemented" so callers take an older kernel's path — and this one has
# no older path to take. Behind that wall stand three more, none of them reached and all of them
# visible in the log: the store wants a *directory* holding a data file and a lock file, and this
# world has no directories at all; it reaches its pages through a mapping, and `mmap` on a file is
# admitted straight to the host; and it asks the filesystem about itself, which nothing here models.
#
# So the storage half of an execution client is a milestone rather than a syscall. Recorded here as
# measured so the next person costs it by reading rather than by finding out.
[m5.mdbx]
binding = "signet-libmdbx 0.8.3, forked from reth-libmdbx"
runs_today = true
events = 208
syscalls = 154
draws = 23
repeats_agreeing = 50
# Sixteen keys written in one transaction, committed, and read back through another. The store an
# OP Stack execution client keeps its chain in, running under the engine and reproducing.
#
# Four walls stood in front of it and each was found by running the probe again rather than by
# reading a list. The mapping is the one everybody expects and was the least of them: what decided
# its design was that the first mapping a store makes is of its *lock* file, whose contents die
# with the process, and not of the data file whose contents a crash oracle is about.
walls_taken_down = [
  [262, "newfstatat", "and with it directories, which this world had none of"],
  [137, "statfs", "one device, ext4's identity, free space derived from what is held"],
  [9, "mmap", "of a file: the call is replaced and the world fills what comes back"],
  [26, "msync", "a durability point, drawn upon exactly as a sync is"],
  [202, "futex", "the three operations of a lock whose word names its holder"],
  [296, "pwritev", "which is how it writes, and so what a crash has to be able to tear"],
]
exclusive = "the probe opens the store exclusively, which is what one process per node is"

# The first campaign against the store an OP Stack execution client keeps its chain in. Drawn
# crashes under guided targeting, and a client that holds the store to what it answered.
#
# **The store kept every promise it made.** Nine thousand four hundred and eighty-one
# acknowledgements asked for back and nine thousand four hundred and eighty-one still there, across
# three hundred and ten crashes — forty-four of which interrupted a sync and tore what it was
# appending. Nothing it removed came back, and nothing it refused was there anyway.
#
# **The forty-one verdicts are the world's own durability watcher, and the client contradicts every
# one of them.** That watcher's approximation is that an acknowledgement is an outbound datagram
# sent while the disk is dirty (docs/API.md 5.6). This store answers reads over the same socket it
# answers writes on, and its first replies are to reads — sent while its file already holds the
# layout it was created with and nothing has been committed yet. A crash there takes the file back
# to nothing and the watcher reports a promise broken, when all that was said is "I do not have
# that record".
#
# Recorded rather than tuned away: what it measures is the limit of judging a request-and-response
# service by its packets, and the number to trust in this campaign is the client's.
[m5.mdbx.campaign]
seeds = 150
scenario = "examples/mdbx-hunt/hunt.toml"
acknowledged = 9_481
verified = 9_481
lost = 0
resurrected = 0
undropped = 0
prepared_lost = 0
crashes = 310
crashed_runs = 132
tears = 44
watcher_verdicts = 41
watcher_verdicts_the_client_confirmed = 0

# The same store with the medium broken under it rather than taken away: a sync that reports
# failure, a write that reports the disk full, and a stall long enough for a crash to land inside a
# sync and tear what it was appending.
#
# **`verified` is well below `acknowledged` here and that is not a loss.** The gap is questions the
# store never answered, because it was dead or unreachable when they were asked. An unanswered
# question is indeterminate and is never used to accuse — it is counted so that a campaign cannot
# quietly turn silence into either verdict.
[m5.mdbx.campaign_hostile_disk]
seeds = 100
scenario = "examples/mdbx-hunt/hunt-disk.toml"
acknowledged = 4_980
verified = 3_795
unanswered = 1_185
lost = 0
resurrected = 0
undropped = 0
crashes = 166
crashed_runs = 80
tears = 15
watcher_verdicts = 0

# The same hunt from a database that already holds two thousand records. An empty store never
# reaches the code a full one lives in: a file grown past its first pages, pages freed and reused, a
