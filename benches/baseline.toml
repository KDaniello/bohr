blocks_without = 4
blocks_with = 6
head_without = "0xedc91d5cb74caeec19e2725a07fcf465afe5539030e238f8d14edb47c66fac10"
head_with = "0x3f880308d9a66e29395363308ae2f93a362452d6d9d0a4cd93d8abe282f55e82"
promises_verified = 5

# A guest that replaces itself is not fully intercepted afterwards, and one line shows it: the
# client started by the supervisor stamps its log 1970-01-01, and the same binary reached through a
# guest that called execve stamps it with the host's own date. Whatever the supervisor does to a
# guest at spawn does not survive the guest doing it again for itself.
#
# Found while trying to put two unlike programs on two nodes of one cluster, which a cluster cannot
# express: it substitutes an index into one argument list. The trick would have been a launcher; the
# answer is per-node argument lists, and that is what shipped — so nothing needs the trick now, and
# the hole is a hole in the guarantee rather than in anybody's way.
#
# testdata/guests/becomes_another.c is the smallest thing that does it.
[m5.exec_hole]
found_by = "a launcher standing in for two programs on one cluster"
supervisor_started = "1970-01-01, which is the world's clock"
reached_by_execve = "the host's own date"
blocks = "nothing; per-node argument lists removed the need for a launcher"

# **The whole of what this world can do to a node is now searchable, and this is the number.** A
# campaign used to draw one kind: the kill. Everything else — the freeze, the cut, the link that
# stops being good — stood where somebody had written a tick down, so a search covered one twelfth
# of the catalogue and the eleven remaining entries were reachable only by a person who had already
# guessed the moment.
#
# Twenty seeds of `examples/redb-hunt/hunt-adverse.toml`, counting narrated faults rather than
# fires: an isolation is four lines — two links, raised and healed — and a degradation is two or
# four depending on the rung it drew. Roughly twenty-nine fires across the twenty runs.
[m2.drawn_catalogue]
