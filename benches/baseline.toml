# **A budget is a ceiling on fires, and the same campaign under one shows it.** Odds say when a
# fault fires and never how many; against a guest that makes millions of eligible calls, a
# probability short enough to be reached at all is a probability reached over and over — measured
# against an execution client, two hundred and seventy kills across twenty runs, which is a
# campaign reporting on the restart path rather than on anything it asked.
#
# The four-fire ceiling above never binds on this guest, which is the honest reading of the two
# tables being equal: the campaign draws about one and a half fires per run on its own. At one it
# binds, and what it takes away is the second and third fault of a run rather than the first.
[m2.drawn_catalogue.budget_of_one]
