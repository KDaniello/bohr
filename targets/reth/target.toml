# reth, the Ethereum execution client, as a development chain under drawn crashes and restarts.

[source]
repository = "https://github.com/paradigmxyz/reth"
commit = "3641f10830f44f71c2469fdf7e818ccd4a4b0e76"

[build]
command = ["targets/reth/build.sh"]
binary = "targets/reth/build/reth"
blake3 = "47d8e0ee44991aaaa51baf129f86f0e950492979f5924382bf08c6bd452b7c3c"

[run]
scenario = "targets/reth/scenario.toml"

[judge]
oracle = "chain"

# What `bohr check reth` holds the pack to; see docs/TESTING.md §16.
[check]
# A calm run reaches its fourteen virtual seconds and answers the probe, rather than failing on the way.
works = { min_events = 100_000, min_virtual_s = 13, probe_answers = 0.9 }
repeats = { times = 10 }
replays = {}
clean = { seeds = "1..10" }
walls = {}
# A changed binary is refused by its digest before anything runs.
refuses_changed = true
