# eth-geth-env, cell S0.
#
# S0: geth driven by the engine driver, a block every 2 s from its pool; no fault.

[run]
horizon_ticks = 50_000_000_000
ends_with_node = 2                # the load, which ends after its final check

[state]
dir = "targets/eth-geth-env/state"
cwd = "/"

[cluster]
nodes = 2
programs = [
  ["targets/geth/build/geth", "--datadir", "/geth", "--networkid", "1337", "--nodiscover",
   "--maxpeers", "0", "--syncmode", "full", "--cache", "64", "--http", "--http.addr", "0.0.0.0",
   "--http.api", "eth,net", "--authrpc.addr", "0.0.0.0", "--authrpc.jwtsecret", "/jwt.hex",
   "--ipcdisable"],
  ["examples/engine-driver/build/engine-driver", "chain", "--leader", "0", "--blocks", "22", "--every-ms", "2000"],
]

[cluster.env]
HOME = "/root"
PATH = "/usr/bin:/bin"

[model]
kind = "chain"
# An execution client's start is part of the window: reth opens its engine API ten seconds in.
moves_within_ticks = 20_000_000_000

[adapter]
kind = "eth-jsonrpc"

[workload]
txs = "/workload/txs"
rate = 20
targets = [0]
nodes = [0]
observe_every_ticks = 1_000_000_000
window_ticks = 30_000_000_000
settle_ticks = 10_000_000_000

[disk]
sync_semantics = "strict"
reorder_unsynced = false
