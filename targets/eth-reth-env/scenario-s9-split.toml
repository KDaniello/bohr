# eth-reth-env, cell S9, with a split seeded: reth runs the chain under another chain id, so it
# refuses the first block that holds a transfer signed for this one, and follows nothing after it.
# Caught by R3.2: the follower never reaches the blocks decided before the window closed.
#
# S9: geth builds every block and reth follows it through the engine API; R2.2 holds the two to
# one state root at every height, as two replicas of one chain.

[run]
horizon_ticks = 50_000_000_000
ends_with_node = 3                # the load, which ends after its final check

[state]
dir = "targets/eth-reth-env/state"
cwd = "/"

[cluster]
nodes = 3
programs = [
  ["targets/geth/build/geth", "--datadir", "/geth", "--networkid", "1337", "--nodiscover",
   "--maxpeers", "0", "--syncmode", "full", "--cache", "64", "--http", "--http.addr", "0.0.0.0",
   "--http.api", "eth,net", "--authrpc.addr", "0.0.0.0", "--authrpc.jwtsecret", "/jwt.hex",
   "--ipcdisable"],
  ["targets/reth/build/reth", "node", "--chain", "/genesis-split.json", "--datadir", "/reth",
   "--disable-discovery", "--ipcdisable", "--http", "--http.addr", "0.0.0.0", "--http.api", "eth",
   "--authrpc.addr", "0.0.0.0", "--authrpc.jwtsecret", "/jwt.hex", "--db.max-size", "48MB",
   "--db.growth-step", "1MB"],
  ["examples/engine-driver/build/engine-driver", "chain", "--leader", "0", "--follower", "1", "--blocks", "22", "--every-ms", "2000"],
]

[cluster.env]
HOME = "/root"
PATH = "/usr/bin:/bin"

[model]
kind = "chain"
# Judged ten seconds after the window closes, inside the load's last observation.
moves_within_ticks = 10_000_000_000

[adapter]
kind = "eth-jsonrpc"

[workload]
txs = "/workload/txs"
rate = 20
targets = [0]
nodes = [0, 1]
observe_every_ticks = 1_000_000_000
window_ticks = 30_000_000_000
settle_ticks = 10_000_000_000

[disk]
sync_semantics = "strict"
reorder_unsynced = false

# The window closes at 20 s, a freeze of the driver for a millisecond, so R3.2 asks whether the
# follower reached every block decided before it: a client that refused one never does.
[[fault]]
kind = "node_freeze"
node = 2
at_tick = 20_000_000_000

[[fault]]
kind = "node_thaw"
node = 2
at_tick = 20_001_000_000
