# redb, the embedded store, under a crash campaign: a write the store acknowledged is a write it
# still has after the node dies and comes back. The harness is examples/redb-hunt, which pins
# redb 2.6.3 in its lock file; the store is driven by a client on a second node and judged by the
# client's acknowledgements, so nothing in the harness knows how redb is laid out.

[source]
repository = "https://github.com/cberner/redb"
commit = "v2.6.3"

[build]
command = ["scripts/build-example.sh", "redb-hunt"]
binary = "examples/redb-hunt/build/redb-hunt"
blake3 = "b1f4569e5a08b13878c3e260266e5d1938673ac5f243327abc20e5f70434cecd"

[run]
scenario = "examples/redb-hunt/hunt.toml"

[judge]
oracle = "durability"

# What `bohr check redb` holds the pack to; see docs/TESTING.md §16.
[check]
works = { min_events = 1_000 }
repeats = { times = 50 }
replays = {}
clean = { seeds = "1..20" }
adversity = { seeds = "1..20", at_least = 0.5 }
walls = {}
workers_agree = { runs = 64, jobs = 4 }
# A changed binary is refused by its digest before anything runs.
refuses_changed = true
