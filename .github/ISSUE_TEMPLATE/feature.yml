name: Feature request
description: A capability Bohr does not have
labels: ["C-feature", "S-needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Check `docs/ARCHITECTURE.md` §13 first — it lists what is deliberately out of scope
        for v1 and when each item would be reconsidered. Arguing with a decision there is
        welcome; it goes in an issue labelled `S-needs-decision`, naming the section.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you were trying to do and where Bohr stopped you. Not the solution — the problem.
    validations: { required: true }

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
    validations: { required: true }

  - type: textarea
    id: prior-art
    attributes:
      label: Prior art
      description: Does rr, Hermit, Antithesis, loom, shuttle or madsim do this? How?

  - type: dropdown
    id: layer
    attributes:
      label: Which layer
      description: See `docs/ARCHITECTURE.md` §2.
      options:
        - Backend — interception, syscalls, hardware
        - Kernel — clock, scheduler, virtual world
        - Explorer — search, coverage, fault injection
        - Reducer — minimisation
        - Reports and debugging
        - SDK
        - CLI or configuration
        - Not sure
    validations: { required: true }
