name: test

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The sans-io core must build and test without Linux. These three runners exist to
  # enforce that design rule (docs/TESTING.md P2), not to promise a platform.
  fast:
    name: test-fast (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/toolchain
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - uses: Swatinem/rust-cache@v2
      - run: make test-fast

  linux:
    name: test-linux (kernel ${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, label: "6.x" }
          - { runner: ubuntu-22.04, label: "5.15" }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/toolchain
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - uses: Swatinem/rust-cache@v2
      # Printed rather than asserted: a runner without CPUID faulting still runs every gate that
      # does not depend on it, and the report is what tells us which gates those are.
      # Ubuntu 23.10 and later block unprivileged user namespaces through AppArmor, and the
      # guest cannot be placed in its own namespaces without them. The 22.04 runner needs
      # nothing; the 24.04 one refuses every guest until this is lifted.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Host capability report
        run: |
          uname -a
          grep -m1 'model name' /proc/cpuinfo
          echo "cpuid_fault: $(grep -c cpuid_fault /proc/cpuinfo)"
          sysctl kernel.yama.ptrace_scope kernel.perf_event_paranoid user.max_user_namespaces || true
      - run: make test-linux
      - run: make test-doc

  bdd:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/toolchain
      - uses: Swatinem/rust-cache@v2
      # Ubuntu 23.10 and later block unprivileged user namespaces through AppArmor, and a
      # guest cannot be placed in its own namespaces without them.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - run: make bdd

  fuzz-short:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        target: [bundle, tape, sdk_record, event_log, syscall_args]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/toolchain
        with: { nightly: "true" }
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - uses: Swatinem/rust-cache@v2
      - run: make fuzz T=${{ matrix.target }} S=60
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/
