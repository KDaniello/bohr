name: docs

on:
  # On both events, for the reason given in sdk.yml: gated on a path, never on an event.
  push:
    branches: [main]
    paths: &docs_paths ["docs/**", "*.md", "scripts/check-docs.sh"]
  pull_request:
    paths: *docs_paths

jobs:
  # Every relative link in the repository resolves.
  structure:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: ./scripts/check-docs.sh

  rustdoc:
    runs-on: ubuntu-24.04
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/toolchain
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --all-features --no-deps
