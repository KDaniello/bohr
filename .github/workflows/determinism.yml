name: determinism

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  NEXTEST_PROFILE: ci

concurrency:
  group: determinism-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Goal T1 and T4. A regression here invalidates stored bundles, and we would not know
  # which ones — so it blocks the merge. See docs/TESTING.md 7.
  gates:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - uses: Swatinem/rust-cache@v2
      # Ubuntu 23.10 and later block unprivileged user namespaces through AppArmor, and a
      # guest cannot be placed in its own namespaces without them.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: make guests
      - name: Repeat-and-compare and golden bundle replay
        run: make test-det
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: divergence
          path: |
            target/bohr-out/**/*.bohr
            target/bohr-out/**/diverge.txt

  # Negative determinism: every injection MUST break the suite above. A green run here
  # with an uncaught injection means the tests have a hole. See docs/TESTING.md 7.4.
  mutation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - uses: Swatinem/rust-cache@v2
      # Ubuntu 23.10 and later block unprivileged user namespaces through AppArmor, and a
      # guest cannot be placed in its own namespaces without them.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: make guests
      # Every injection is a separate feature set and therefore a separate build; six of them
      # do not fit beside the toolchains a runner ships with. Removing what this repository
      # never uses frees more than twenty gigabytes.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc                       /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true
          df -h /
      - run: ./scripts/mutation-harness.sh
