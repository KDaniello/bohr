[package]
name = "bohr-probe"
description = "The guest that asks a cluster's nodes what they did, over their own JSON-RPC."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

# A guest, not part of the supervisor: it runs inside a world, reads that world's clock and draws
# that world's randomness, so every call it makes is modelled. Built static by scripts/build-probe.sh,
# because a world holds no dynamic loader.
[[bin]]
name = "bohr-probe"
path = "src/main.rs"

[dependencies]
bohr-sdk = { path = "../../sdk/rust", version = "0.0.0" }
bohr-sdk-proto.workspace = true

[lints]
workspace = true
