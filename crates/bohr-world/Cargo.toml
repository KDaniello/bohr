[package]
name = "bohr-world"
description = "A world model answering clock and randomness for a single node."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
bohr-backend.workspace = true
bohr-kernel.workspace = true
bohr-sdk-proto.workspace = true
bohr-tape.workspace = true
bohr-trace.workspace = true
bohr-types.workspace = true
serde.workspace = true
thiserror.workspace = true
toml.workspace = true

[dev-dependencies]
bohr-backend-null.workspace = true

[features]
# Deliberate defects, each breaking determinism at one named site. Off in every build that is
# not the mutation harness, which asserts the determinism suite goes red for each in turn.
chaos-syscall-passthru = []
chaos-futex-order = []
chaos-node-clock-shared = []
chaos-deadline-tie = []
chaos-fault-moment-drift = []
chaos-unknown-descriptor = []
chaos-proc-on-the-disk = []

[lints]
workspace = true
