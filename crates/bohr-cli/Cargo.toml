[package]
name = "bohr-cli"
description = "The bohr binary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "bohr"
path = "src/main.rs"

[dependencies]
bohr-backend.workspace = true
bohr-backend-null.workspace = true
bohr-backend-ptrace.workspace = true
bohr-kernel.workspace = true
bohr-reducer.workspace = true
bohr-report.workspace = true
bohr-sdk-proto.workspace = true
bohr-tape.workspace = true
bohr-testkit.workspace = true
bohr-trace.workspace = true
bohr-types.workspace = true
bohr-world.workspace = true
bohr-explorer.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

[dev-dependencies]
bohr-kernel.workspace = true
bohr-trace.workspace = true
bohr-types.workspace = true
cucumber.workspace = true
futures.workspace = true
serde_json.workspace = true

# The feature files are read at run time rather than compiled, so the runner brings its own main.
# That main cannot answer the question a test lister asks it, so the target is kept out of the
# default set and named explicitly by `make bdd`. Left in, a runner that enumerates tests fails on
# this one target and reports nothing about the rest.
[[test]]
name = "bdd"
harness = false
test = false

[lints]
workspace = true
