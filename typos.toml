[files]
extend-exclude = [
  "LICENSE-APACHE",
  "testdata/**",
  "fuzz/corpus/**",
  "fuzz/seeds/**",
  "*.tape",
  "*.bohr",
  # Pre-signed transactions, one base64 line each: data, not words.
  "targets/*/state/workload/txs",
]

[default.extend-words]
# Domain vocabulary that spell checkers dislike.
ba = "ba"
inout = "inout"
seccomp = "seccomp"
