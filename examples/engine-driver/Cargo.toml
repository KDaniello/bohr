# Deliberately outside the tool's workspace: this guest exists to drive somebody else's node, and
# the tool's own dependency graph stays narrow (docs/ARCHITECTURE.md §5.11).
[workspace]

[package]
name = "engine-driver"
version = "0.0.0"
edition = "2021"
publish = false

# No dependencies: the token's HMAC-SHA256 is written here, held to RFC 4231's test vectors, so the
# driver builds wherever the tool does, with nothing fetched.
[dependencies]

[[bin]]
name = "engine-driver"
path = "src/main.rs"

[profile.release]
debug = 1
