[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bohr-sdk"
version = "0.0.0"
description = "Tell Bohr what your program promises."
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
# Empty by rule: a program that installs this must not have to resolve a dependency of ours.
# See docs/ARCHITECTURE.md 9, rule S3.
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
