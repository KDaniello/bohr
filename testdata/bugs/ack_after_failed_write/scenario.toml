# ack_after_failed_write: a write's ENOSPC ignored, and the record acknowledged, judged by R7.1.
#
# S7: a disk that refuses a quarter of the writes that need space.

[run]
horizon_ticks = 30_000_000

[cluster]
nodes = 1
argv = ["testdata/guests/build/ack_after_failed_write"]

[model]
kind = "kv"
ready_within_ticks = 5_000_000

[disk]
reorder_unsynced = false
enospc_probability = "1/4"
