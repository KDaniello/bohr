# fsync_retry_after_eio: a failed fsync retried, and the retry's success taken as durability, judged by R7.1.
#
# S7: a disk whose fsync fails a quarter of the time, dropping what it had not synced.

[run]
horizon_ticks = 30_000_000

[cluster]
nodes = 1
argv = ["testdata/guests/build/fsync_retry_after_eio"]

[model]
kind = "kv"
ready_within_ticks = 5_000_000

[disk]
reorder_unsynced = false
eio_probability = "1/4"
