# move_not_atomic: a move between two counters written as a debit and a credit apart, judged by R5.1.
#
# S6: a kill in the middle of an operation, a crash keeping all of the unsynced or none.

[run]
horizon_ticks = 30_000_000

[cluster]
nodes = 1
argv = ["testdata/guests/build/move_not_atomic"]

[disk]
reorder_unsynced = false

[model]
kind = "kv"

[[fault]]
kind = "node_kill"
node = 0
at_tick = 1_500_000

[[fault]]
kind = "node_restart"
node = 0
at_tick = 3_000_000
