[graph]
targets = [
  "x86_64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
]

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = ["Apache-2.0", "MIT", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

# A determinism tool that ships a compromised dependency is worse than no tool.
# Dependencies are few by rule; the SDKs have none. See docs/ARCHITECTURE.md 11.
deny = [
  { name = "openssl-sys", reason = "no TLS in this tool; nothing here talks to a network" },
  { name = "reqwest", reason = "bohr transmits nothing: no telemetry, no update check" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
